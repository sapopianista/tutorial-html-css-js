<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>TiBags - Contato</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <header>
        <div class="wrapper" style="height: 90px;">
            <div class="flexrow" style="height: 90px;">
                <img src="img/logo.svg">
                <h1><span style="color:#68AFFF;">Ti</span>Bags</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="quem-somos.html">Quem Somos</a></li>
                    <li><a href="contato.html" class="active">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <div class="wrapper">
        <div class="flexrow">
            <main>
                <h1>Contato</h1>
                
                <form>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome">
                    <br>
                    <label for="password" id="password">Senha</label>
                    <input type="password" id="password" name="password">
                    <br>
                    <input type="checkbox" id="news" name="news">
                    <label for="news">Deseja receber nossos e-mails de novidades</label>
                    <br>
                    <label for="message">Mensagem:</label>
                    <br>
                    <textarea id="message" name="message"></textarea>
                    <p>Qual sua bolsa preferida?</p>
                    <input type="radio" id="nyse" name="bolsa" value="NYSE"> <label for="NYSE">NYSE</label>
                    <br>
                    <input type="radio" id="nasdaq" name="bolsa" value="Nasdaq"> <label for="Nasdaq">Nasdaq</label>
                    <br>
                    <input type="radio" id="bovespa" name="bolsa" value="Bovespa"> <label for="Bovespa">Bovespa</label>
                    <br>
                    <input type="submit" id="bolsa" name="bolsa">
                </form>
        </main>
    </div>
</body>
<footer>
    <div class="wrapper" style="height: 120px;"></div>
</footer>
<script src="js/main.js"></script>
</html>
