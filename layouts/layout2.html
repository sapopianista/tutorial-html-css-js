<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout 2</title>
</head>
<style>
    
    aside {
        background-color: aqua;
        height: 1000px;
        width: 300px;
    }

    main{
        display: flex;
        background-color: aquamarine;
        width: 1100px;
    }

    #flex-row{
        display: flex;
        flex-wrap: wrap;
        align-content: space-between;
        height: 1000px;
        width: 800px;
    }

    header {
        background-color: rgb(255, 195, 195);
        height: 200px;
        width: 800px;
    }

    footer {
        background-color: rgb(255, 195, 195);
        height: 200px;
        width: 800px;
    }

    </style>
<body>
    <main>
        <aside></aside>
        <div id="flex-row">
            <header></header>
            <footer></footer>
        </div>
    </main>
</body>
</html>
