<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout 4</title>
</head>
<body>
    <style>
        header{
            height: 200px;
            width: 100%;
            display: flex;
            background-color: grey;
            align-items: center;
            justify-content: space-around;
        }

        header logo{
            width: 50px;
            height: 50px;
            background-color: black;
        }

        header menu{
            width: 150px;
            height: 50px;
            background-color: black;
        }

        main{
            height: 800px;
            width: 100%;
            display: flex;
            align-content: space-around;
            flex-wrap: wrap;
        }

        #section1{
            background-color: aquamarine;
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #section1 img{
            height: 300px;
            width: 300px;
            background-color: blueviolet;
        }

        #texto{
            height: 200px;
            width: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        #section2{
            background-color: rgb(165, 127, 255);
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        #section2 img{
            height: 300px;
            width: 300px;
            background-color: rgb(198, 226, 43);
        }

        footer{
            background-color: rgb(227, 255, 127);
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        footer img{
            height: 300px;
            width: 300px;
            background-color: rgb(226, 43, 43);
        }

        footer textarea{
            height: 100px;
            width: 250px;
            background-color: aquamarine;
            align-self: flex-start;
        }

    </style>

    <header>
        <logo></logo>
        <menu></menu>
    </header>
    <main>
        <div id="section1">
            <img></img>
            <div id="texto">
                <h1>texto</h1>
                <h2>mais texto</h2>
            </div>
        </div>
        <div id="section2">
            <img></img>
            <img></img>
            <img></img>
        </div>
        <footer>
            <img></img>
            <textarea></textarea>
        </footer>
    </main>
</body>
</html>
