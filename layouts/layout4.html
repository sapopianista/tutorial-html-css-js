<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout 4</title>
</head>
<body>
    <style>
        header{
            height: 200px;
            width: 100%;
            display: flex;
            background-color: grey;
            align-items: center;
            justify-content: space-between;
        }

        header logo{
            width: 50px;
            height: 50px;
            background-color: black;
            margin: 0px 50px;
        }

        header menu{
            width: 150px;
            height: 50px;
            background-color: black;
            margin: 0px 50px;
        }

        main{
            height: 800px;
            width: 100%;
            display: flex;
            align-content: space-around;
            flex-wrap: wrap;
        }

        #section1{
            background-color: aquamarine;
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10%;
        }

        #section1 img{
            height: 300px;
            width: 300px;
            background-color: blueviolet;
        }

        #textbox{
            height: 100px;
            width: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            color: blueviolet;
        }

        #tittle{
            background-color: blueviolet;
            width: 200px;
            height: 40px;
        }

        #subtittle{
            background-color: blueviolet;
            width: 200px;
            height: 40px;
        }

        #section2{
            background-color: rgb(165, 127, 255);
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        #section2 img{
            height: 300px;
            width: 300px;
            background-color: rgb(198, 226, 43);
        }

        footer{
            background-color: rgb(227, 255, 127);
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        footer img{
            height: 300px;
            width: 300px;
            background-color: rgb(226, 43, 43);
        }

        footer div{
            height: 100px;
            width: 250px;
            background-color: aquamarine;
            align-self: flex-start;
            margin-top: 20px;
        }

    </style>

    <header>
        <logo></logo>
        <menu></menu>
    </header>
    <main>
        <div id="section1">
            <img></img>
            <div id="textbox">
                <div id="tittle"></div>
                <div id="subtittle"></div>
            </div>
        </div>
        <div id="section2">
            <img></img>
            <img></img>
            <img></img>
        </div>
        <footer>
            <img></img>
            <div></div>
        </footer>
    </main>
</body>
</html>
